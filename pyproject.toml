[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-kernel-hilbert-svm"
version = "2.0.0"
description = "Quantum Kernel Hilbert Space Support Vector Machine Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
ml = ["scikit-learn>=1.4,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
quantum-kernel-hilbert-svm = "quantum_kernel_svm.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-kernel-hilbert-svm"
Repository = "https://github.com/abusuraihsakhri/quantum-kernel-hilbert-svm.git"

[tool.setuptools]
packages = ["agents", "quantum_kernel_svm"]
py-modules = ["enrichment", "simulator"]
