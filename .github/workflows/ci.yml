name: Quantum Kernel Hilbert Svm CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,ml,dev]"

    - name: Run Pytest Suite
      run: |
        python -m compileall -q agents quantum_kernel_svm
        pytest -v

    - name: Audit signature and identifier regression check
      run: |
        python -c "
        from agents.base import AuditTrail, PHIGuard, SecurityException
        trail = AuditTrail(secret_key='ci-check')
        trail.log('CI', 'test', 'record', {'value': 1})
        assert trail.verify_integrity()
        trail.logs[0]['actor'] = 'tampered'
        assert not trail.verify_integrity()
        try:
            PHIGuard.assert_no_phi('MRN-123456')
        except SecurityException:
            pass
        else:
            raise AssertionError('Identifier guard did not reject test input')
        print('Audit signature and identifier regression check passed')
        "
